<svg width="300" height="450" xmlns="http://www.w3.org/2000/svg">
  <rect width="300" height="450" fill="#2a2a2a"/>
  <rect x="20" y="20" width="260" height="410" fill="#1a1a1a" stroke="#444" stroke-width="2"/>
  
  <!-- Film strip pattern -->
  <rect x="20" y="20" width="260" height="30" fill="#333"/>
  <rect x="20" y="400" width="260" height="30" fill="#333"/>
  
  <!-- Film holes -->
  <circle cx="40" cy="35" r="4" fill="#000"/>
  <circle cx="60" cy="35" r="4" fill="#000"/>
  <circle cx="80" cy="35" r="4" fill="#000"/>
  <circle cx="100" cy="35" r="4" fill="#000"/>
  <circle cx="120" cy="35" r="4" fill="#000"/>
  <circle cx="140" cy="35" r="4" fill="#000"/>
  <circle cx="160" cy="35" r="4" fill="#000"/>
  <circle cx="180" cy="35" r="4" fill="#000"/>
  <circle cx="200" cy="35" r="4" fill="#000"/>
  <circle cx="220" cy="35" r="4" fill="#000"/>
  <circle cx="240" cy="35" r="4" fill="#000"/>
  <circle cx="260" cy="35" r="4" fill="#000"/>
  
  <circle cx="40" cy="415" r="4" fill="#000"/>
  <circle cx="60" cy="415" r="4" fill="#000"/>
  <circle cx="80" cy="415" r="4" fill="#000"/>
  <circle cx="100" cy="415" r="4" fill="#000"/>
  <circle cx="120" cy="415" r="4" fill="#000"/>
  <circle cx="140" cy="415" r="4" fill="#000"/>
  <circle cx="160" cy="415" r="4" fill="#000"/>
  <circle cx="180" cy="415" r="4" fill="#000"/>
  <circle cx="200" cy="415" r="4" fill="#000"/>
  <circle cx="220" cy="415" r="4" fill="#000"/>
  <circle cx="240" cy="415" r="4" fill="#000"/>
  <circle cx="260" cy="415" r="4" fill="#000"/>
  
  <!-- Movie camera icon -->
  <g transform="translate(150, 200)">
    <!-- Camera body -->
    <rect x="-40" y="-30" width="80" height="60" rx="8" fill="#555"/>
    <!-- Lens -->
    <circle cx="0" cy="0" r="25" fill="#333" stroke="#777" stroke-width="2"/>
    <circle cx="0" cy="0" r="18" fill="#222"/>
    <circle cx="0" cy="0" r="12" fill="#111"/>
    <!-- Viewfinder -->
    <rect x="-15" y="-40" width="30" height="15" rx="3" fill="#555"/>
    <!-- Flash -->
    <rect x="25" y="-20" width="8" height="12" rx="2" fill="#666"/>
  </g>
  
  <!-- Text -->
  <text x="150" y="320" text-anchor="middle" fill="#888" font-family="Arial, sans-serif" font-size="16" font-weight="bold">No Image</text>
  <text x="150" y="340" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="12">Available</text>
</svg>
